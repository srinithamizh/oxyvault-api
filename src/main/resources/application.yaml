server:
  port: 8080

application:
  name: OxyVault
  version: 1.0.0
  developer:
    name: Thamizharasan Srinivasan
    email: srinithamizh@gmail.com

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    # REST API: don't keep a DB connection checked out for the whole request.
    open-in-view: false
    hibernate:
      ddl-auto: update

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org:
      springframework:
        # TRACE logs every filter in the chain on every request. Set SECURITY_LOG_LEVEL=TRACE when debugging.
        security: ${SECURITY_LOG_LEVEL:INFO}
